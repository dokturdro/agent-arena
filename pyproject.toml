[project]
name = "agentarena"
version = "0.1.0"
description = "Multi-metric evaluation harness and leaderboard for tool-using and research agents."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "openai>=1.50",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "jsonschema>=4.22",
    "python-dotenv>=1.0",
]

[project.scripts]
arena = "agentarena.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentarena"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
